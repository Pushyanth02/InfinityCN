<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Multi-stop luxury gold gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c" />
      <stop offset="35%" stop-color="#e6c270" />
      <stop offset="70%" stop-color="#d9ad52" />
      <stop offset="100%" stop-color="#946d2e" />
    </linearGradient>

    <!-- Warm Amber Glow Halo -->
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9ad52" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d9ad52" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08070a" stop-opacity="0" />
    </radialGradient>

    <!-- Background Plate Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14111a" />
      <stop offset="100%" stop-color="#08070a" />
    </linearGradient>
  </defs>

  <!-- Obsidian squircle base plate -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  
  <!-- Subtle gold perimeter border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#d9ad52" stroke-opacity="0.22" stroke-width="1.2" />

  <!-- Amber radiant glow -->
  <circle cx="32" cy="32" r="22" fill="url(#favGlow)" />

  <!-- Precision Lemniscate Mark -->
  <path
    d="M 32 32 C 37.5 24 45.5 21 51.5 24.5 C 57.5 28 58 35.5 52 39.5 C 46 43.5 37.5 39.5 32 32 C 26.5 24.5 18 20.5 12 24.5 C 6 28.5 6.5 36 12.5 39.5 C 18.5 43 26.5 40 32 32 Z"
    fill="none"
    stroke="url(#favGold)"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
