# Render deployment configuration
# https://render.com/docs/blueprint-spec
#
# Prerequisites:
#   1. Change prisma/schema.prisma provider to "postgresql" before deploying
#   2. The DATABASE_URL will be automatically set from the Render PostgreSQL database
#
services:
  - type: web
    name: lemniscate
    runtime: node
    plan: starter
    buildCommand: bun install && bun run db:generate && bun run build:standalone
    startCommand: bun run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lemniscate-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: LEMNISCATE_AUTH_SECRET
        generateValue: true
      # AI provider — set your OpenRouter key in the Render dashboard.
      # (sync: false means the value is entered in the dashboard, never committed.)
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: lemniscate-db
    plan: starter
    ipAllowList: []
