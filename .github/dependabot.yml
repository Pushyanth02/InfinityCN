# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm — the app's primary dependency manifest (used by Docker + Vercel builds).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Radix primitives move in lockstep — batch them.
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-libsql"
      testing:
        patterns:
          - "vitest"
      lint:
        patterns:
          - "eslint"
          - "eslint-config-next"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"

  # The standalone worker mini-service.
  - package-ecosystem: "npm"
    directory: "/mini-services/lemniscate-worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(worker)"
      include: "scope"
    labels:
      - "dependencies"

  # Docker base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    labels:
      - "dependencies"
