# =============================================================================
# Lemniscate — CodeQL (GitHub Advanced Security)
# =============================================================================
# Static analysis for JavaScript/TypeScript. Uploads SARIF results to GitHub
# Security for Code Scanning alerts.
# =============================================================================
name: CodeQL

on:
  push:
    branches: [main, v0]
  pull_request:
    branches: [main, v0]
  schedule:
    # Weekly scan on the default branch — off the :00 mark to spread load.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (js-ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Build mode: none — JS/TS analysis does not require compilation.
          config: |
            paths-ignore:
              - node_modules
              - .next
              - build
              - out
              - coverage

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
