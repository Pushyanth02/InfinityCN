# =============================================================================
# Lemniscate — CodeQL
# =============================================================================
# Static analysis for security vulnerabilities and coding errors. Runs on
# pushes/PRs to the mainline branches and on a weekly schedule so newly
# disclosed query packs still catch regressions on a quiet repo.
#
# The project is JavaScript/TypeScript only, so CodeQL uses the `none` build
# mode (no compilation step required — it analyses the source directly).
# =============================================================================
name: CodeQL

on:
  push:
    branches: [main, v0]
  pull_request:
    branches: [main, v0]
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"

# Cancel superseded runs for the same ref.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload results to the Security → Code scanning tab.
      security-events: write
      # Required by CodeQL to read the workflow run / private repo contents.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect repository default CodeQL setup
        id: default-setup
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/code-scanning/default-setup",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                },
              );
              core.info(`Default setup state: ${data?.state ?? "unknown"}`);
              core.setOutput("state", data?.state ?? "unknown");
            } catch (error) {
              core.warning(
                `Could not detect default setup state; proceeding with advanced workflow. ${error.message}`,
              );
              core.setOutput("state", "unknown");
            }

      - name: Skip advanced CodeQL when default setup is configured
        if: steps.default-setup.outputs.state == 'configured'
        run: |
          echo "Repository default CodeQL setup is configured."
          echo "Skipping advanced CodeQL workflow to avoid SARIF upload conflicts."

      - name: Initialize CodeQL
        if: steps.default-setup.outputs.state != 'configured'
        # github/codeql-action is GitHub-owned (trusted publisher); pinned to
        # the v3 major tag which GitHub maintains as a moving, supported ref.
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` adds the higher-signal security queries on top
          # of the default suite (path traversal, unsafe deserialization, etc.).
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.default-setup.outputs.state != 'configured'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
