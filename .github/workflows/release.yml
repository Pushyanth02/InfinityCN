# =============================================================================
# Lemniscate — Release
# =============================================================================
# Build and publish a container image when a version tag is pushed. Requires
# the GitHub Actions OIDC token to be trusted on the target registry (e.g.
# GHCR). Disabled by default — set the registry secrets to activate.
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # Pinned to an immutable commit SHA (docker/login-action v3).
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        # Pinned to an immutable commit SHA (docker/build-push-action v6).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
