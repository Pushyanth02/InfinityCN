# =============================================================================
# Lemniscate — CI
# =============================================================================
# Lint, typecheck, test, and build on every push and pull request. Runs on the
# canonical Bun path (the Dockerfile and Vercel also use Bun).
# =============================================================================
name: CI

on:
  push:
    branches: [main, v0]
  pull_request:
    branches: [main, v0]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Shared by the Test and Build steps. Locally these come from a gitignored
    # `.env`; CI has none, so set them here. The integration/e2e tests
    # (src/__e2e__, progress.test.ts) query a real SQLite DB — its schema is
    # created by the `prisma db push` step below before the tests run.
    env:
      DATABASE_URL: file:/tmp/lemniscate-ci.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # --ignore-scripts matches the Dockerfile; prisma generate runs below.
        # --frozen-lockfile keeps CI reproducible against the committed bun.lock.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare test database (schema)
        # Integration/e2e tests hit a real SQLite DB; create its schema first.
        run: bunx prisma db push --skip-generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build:unix

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        # Pinned to an immutable commit SHA (docker/build-push-action v6).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lemniscate:ci
