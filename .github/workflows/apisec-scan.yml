name: APIsec

on:
  push:
    branches: [main, v0]
  pull_request:
    branches: [main, v0]
  schedule:
    - cron: "18 18 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-apisec-scan:
    name: Trigger APIsec scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - name: Check APIsec credentials
        id: credentials
        run: |
          if [ -n "${{ secrets.apisec_username }}" ] && [ -n "${{ secrets.apisec_password }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APIsec scan
        if: steps.credentials.outputs.configured == 'true'
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          apisec-profile: "Master"
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: steps.credentials.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./apisec-results.sarif

      - name: Skip APIsec scan when credentials are missing
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "APIsec credentials are not configured."
          echo "Set secrets 'apisec_username' and 'apisec_password' to enable scanning."
