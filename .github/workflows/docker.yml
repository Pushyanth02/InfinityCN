# Verifies the production Docker image builds successfully.
# Runs on PRs touching Docker-related files and on main/v0 pushes.
name: Docker Build

# Least-privilege: no default token permissions granted. This build only needs
# to read the repo and push to the GHA cache — no writes to the repo/registry.
permissions:
  contents: read

on:
  push:
    branches: [main, v0]
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "package.json"
      - "bun.lock"

jobs:
  build-app:
    name: Build app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Pinned to an immutable commit SHA (docker/setup-buildx-action v3).
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build app image
        # Pinned to an immutable commit SHA (docker/build-push-action v6).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: lemniscate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: docker image inspect lemniscate:ci --format='{{.Os}}/{{.Architecture}} size={{.Size}}'

  build-worker:
    name: Build worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Pinned to an immutable commit SHA (docker/setup-buildx-action v3).
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build worker image
        # Pinned to an immutable commit SHA (docker/build-push-action v6).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          load: true
          tags: lemniscate-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
