# =============================================================================
# Lemniscate — Dependency Review
# =============================================================================
# Surface vulnerable / out-of-compliance dependencies on pull requests.
# =============================================================================
name: Dependency Review

on:
  pull_request:
    branches: [main, v0]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
